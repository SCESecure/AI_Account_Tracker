<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyWhite" x1="130" y1="80" x2="390" y2="405" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#E3E6EF"/>
    </linearGradient>

    <linearGradient id="screen" x1="142" y1="145" x2="372" y2="279" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20266B"/>
      <stop offset="100%" stop-color="#11174A"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9CDF4"/>
      <stop offset="100%" stop-color="#AEB4E2"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#BAC1D4" flood-opacity="0.42"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .line {
        stroke:#66EAFF;
        stroke-width:18;
        stroke-linecap:round;
        stroke-linejoin:round;
        fill:none;
        filter:url(#glow);
      }
      .fill {
        fill:#66EAFF;
        filter:url(#glow);
      }
      .brow {
        stroke:#66EAFF;
        stroke-width:12;
        stroke-linecap:round;
        fill:none;
        opacity:0.98;
        filter:url(#glow);
      }
    </style>
  </defs>

  <ellipse cx="256" cy="432" rx="118" ry="24" fill="#C7CDDD" opacity="0.38"/>

  <g filter="url(#softShadow)">
    <rect x="74" y="176" width="70" height="106" rx="35" fill="url(#purple)"/>
    <rect x="368" y="176" width="70" height="106" rx="35" fill="url(#purple)"/>

    <rect x="239" y="43" width="34" height="77" rx="17" fill="#4E61FF"/>

    <rect x="102" y="78" width="308" height="264" rx="108" fill="url(#bodyWhite)"/>
    <rect x="128" y="131" width="256" height="160" rx="57" fill="#EEF1F8"/>
    <rect x="141" y="143" width="230" height="136" rx="48" fill="url(#screen)"/>
    <path d="M170 154 C220 136 302 138 349 156" stroke="white" stroke-opacity="0.09" stroke-width="16" stroke-linecap="round"/>

    
    <ellipse class="fill" cx="190" cy="189" rx="16" ry="22"/>
    <ellipse class="fill" cx="322" cy="189" rx="16" ry="22"/>
    <path class="line" d="M220 246 H292"/>


    <rect x="208" y="322" width="96" height="68" rx="31" fill="url(#purple)"/>
    <path d="M150 430 C160 381 199 354 256 354 C313 354 352 381 362 430 C343 456 169 456 150 430Z" fill="url(#bodyWhite)"/>
  </g>
</svg>